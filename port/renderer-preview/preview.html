<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Dungeon Hunter 2 mesh renderer diagnostic</title>
<style>
  body { background: #101d2d; color: #e7eef6; font: 14px sans-serif; margin: 16px; }
  canvas { border: 1px solid #42566c; display: block; }
  #result { white-space: pre-wrap; }
</style>
<h1>Dungeon Hunter 2 mesh renderer diagnostic</h1>
<canvas id="view" width="512" height="512"></canvas>
<pre id="result">Rendering…</pre>
<script>
'use strict';
const activeScript = document.currentScript;
const input = JSON.parse(atob('@@INPUT_BASE64@@'));
const canvas = document.getElementById('view');
const result = document.getElementById('result');
function finish(value) {
  result.textContent = JSON.stringify(value);
  result.setAttribute('data-complete', 'true');
  activeScript.remove();
}
function fail(stage, message) { finish({ok: false, stage, error: String(message)}); }
function compile(gl, type, source) {
  const shader = gl.createShader(type);
  gl.shaderSource(shader, source);
  gl.compileShader(shader);
  if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
    throw new Error(gl.getShaderInfoLog(shader) || 'shader compile failed');
  }
  return shader;
}
try {
  const gl = canvas.getContext('webgl', {preserveDrawingBuffer: true, antialias: false});
  if (!gl) throw new Error('WebGL1 context unavailable');
  const vertex = compile(gl, gl.VERTEX_SHADER, input.vertex_shader);
  const fragment = compile(gl, gl.FRAGMENT_SHADER, input.fragment_shader);
  const program = gl.createProgram();
  gl.attachShader(program, vertex);
  gl.attachShader(program, fragment);
  gl.linkProgram(program);
  if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
    throw new Error(gl.getProgramInfoLog(program) || 'program link failed');
  }
  gl.useProgram(program);
  const positionLocation = gl.getAttribLocation(program, 'Vertex');
  const matrixLocation = gl.getUniformLocation(program, 'WorldViewProjectionMatrix');
  if (positionLocation < 0 || !matrixLocation) {
    throw new Error('Required original shader inputs are missing');
  }
  const xy = input.positions.flatMap(p => p.slice(0, 3));
  const vertexBuffer = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, vertexBuffer);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(xy), gl.STATIC_DRAW);
  gl.enableVertexAttribArray(positionLocation);
  gl.vertexAttribPointer(positionLocation, 3, gl.FLOAT, false, 12, 0);
  const indexBuffer = gl.createBuffer();
  gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, indexBuffer);
  gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, new Uint16Array(input.indices), gl.STATIC_DRAW);
  if (input.mode === 'textured') {
    const uvLocation = gl.getAttribLocation(program, 'TexCoord0');
    const colorLocation = gl.getAttribLocation(program, 'Color0');
    const samplerLocation = gl.getUniformLocation(program, 'texture');
    if (uvLocation < 0 || colorLocation < 0 || !samplerLocation) {
      throw new Error('Required original textured shader inputs are missing');
    }
    if (input.uvs.length !== input.positions.length) {
      throw new Error('UV and position counts differ');
    }
    const uvBuffer = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, uvBuffer);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(input.uvs.flat()), gl.STATIC_DRAW);
    gl.enableVertexAttribArray(uvLocation);
    gl.vertexAttribPointer(uvLocation, 2, gl.FLOAT, false, 8, 0);
    gl.disableVertexAttribArray(colorLocation);
    gl.vertexAttrib4f(colorLocation, 1, 1, 1, 1);
    const binary = atob(input.texture_rgba_base64);
    if (binary.length !== input.texture_width * input.texture_height * 4) {
      throw new Error('Decoded texture byte length is wrong');
    }
    const rgba = new Uint8Array(binary.length);
    for (let i = 0; i < binary.length; i++) rgba[i] = binary.charCodeAt(i);
    const texture = gl.createTexture();
    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_2D, texture);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    gl.pixelStorei(gl.UNPACK_ALIGNMENT, 1);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, input.texture_width,
                  input.texture_height, 0, gl.RGBA, gl.UNSIGNED_BYTE, rgba);
    gl.uniform1i(samplerLocation, 0);
  } else {
    const colorLocation = gl.getUniformLocation(program, 'DiffuseColor');
    if (!colorLocation) throw new Error('Required original flat shader color is missing');
    gl.uniform4f(colorLocation, 1.0, 0.63, 0.21, 1.0);
  }
  const minX = Math.min(...input.positions.map(p => p[0]));
  const maxX = Math.max(...input.positions.map(p => p[0]));
  const minY = Math.min(...input.positions.map(p => p[1]));
  const maxY = Math.max(...input.positions.map(p => p[1]));
  const extent = Math.max(maxX - minX, maxY - minY) * 1.25;
  if (!(extent > 0)) throw new Error('Degenerate XY bounds');
  const cx = (minX + maxX) / 2;
  const cy = (minY + maxY) / 2;
  const scale = 2 / extent;
  gl.uniformMatrix4fv(matrixLocation, false, new Float32Array([
    scale, 0, 0, 0,
    0, scale, 0, 0,
    0, 0, 0, 0,
    -cx * scale, -cy * scale, 0, 1
  ]));
  gl.disable(gl.CULL_FACE);
  gl.disable(gl.DEPTH_TEST);
  gl.viewport(0, 0, canvas.width, canvas.height);
  gl.clearColor(16 / 255, 29 / 255, 45 / 255, 1);
  gl.clear(gl.COLOR_BUFFER_BIT);
  gl.drawElements(gl.TRIANGLES, input.indices.length, gl.UNSIGNED_SHORT, 0);
  gl.finish();
  const pixels = new Uint8Array(canvas.width * canvas.height * 4);
  gl.readPixels(0, 0, canvas.width, canvas.height, gl.RGBA, gl.UNSIGNED_BYTE, pixels);
  const error = gl.getError();
  if (error !== gl.NO_ERROR) throw new Error('OpenGL error ' + error);
  let colored = 0;
  const colors = new Set();
  let minPX = canvas.width, maxPX = -1, minPY = canvas.height, maxPY = -1;
  for (let y = 0; y < canvas.height; y++) {
    for (let x = 0; x < canvas.width; x++) {
      const i = 4 * (y * canvas.width + x);
      const changed = input.mode === 'textured'
        ? Math.abs(pixels[i] - 16) + Math.abs(pixels[i + 1] - 29)
          + Math.abs(pixels[i + 2] - 45) > 24
        : pixels[i] > 180 && pixels[i + 1] > 90 && pixels[i + 2] < 110;
      if (changed) {
        colored++;
        colors.add((pixels[i] << 16) | (pixels[i + 1] << 8) | pixels[i + 2]);
        minPX = Math.min(minPX, x); maxPX = Math.max(maxPX, x);
        minPY = Math.min(minPY, y); maxPY = Math.max(maxPY, y);
      }
    }
  }
  if (colored < 100) throw new Error('Draw produced too few colored pixels: ' + colored);
  if (input.mode === 'textured' && colors.size < 2) {
    throw new Error('Textured draw produced a single RGB color');
  }
  finish({ok: true, webgl_version: gl.getParameter(gl.VERSION),
          mode: input.mode, vertex_count: input.positions.length,
          index_count: input.indices.length, distinct_rgb_colors: colors.size,
          colored_pixels: colored, colored_bounds: [minPX, minPY, maxPX, maxPY],
          png_base64: canvas.toDataURL('image/png').split(',')[1]});
} catch (error) { fail('webgl', error.message || error); }
</script>
</html>
